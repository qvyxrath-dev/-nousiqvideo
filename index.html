<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ты решишь это за 5 секунд?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1220;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#stage{position:fixed;inset:0;display:grid;grid-template-rows:18vh 18vh 30vh 14vh 20vh;padding:0 7vw}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .6s ease}
.slot.on{opacity:1}
#tagrow{align-items:flex-end;padding-bottom:7vh}
#head{font-size:5.5vw;font-weight:700;color:#9aa6c2}
#q{font-size:10vw;font-weight:800;line-height:1;white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:4vw;width:100%}
.opt{aspect-ratio:1;border-radius:6vw;background:#16213a;display:flex;align-items:center;justify-content:center;font-size:9vw;font-weight:800;opacity:0;transform:scale(.92);transition:opacity .4s,transform .4s,background .4s,box-shadow .4s,filter .4s}
.opt.on{opacity:1;transform:scale(1)}
.opt.hit{background:#14453b;box-shadow:0 0 0 1.2vw #7fd4a0}
.opt.miss{filter:brightness(.6)}
#ans{font-size:10vw;font-weight:800;color:#7fd4a0}
#tag{font-size:4.6vw;font-weight:600;color:#9aa6c2}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:64vw;height:9vh;border:0;border-radius:999px;background:#14453b;color:#fff;font-size:5vw;font-weight:700;cursor:pointer}
#start.gone{display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="slot" id="headrow"><div id="head">Ты решишь это за 5 секунд?</div></div>
  <div class="slot" id="qrow"><div id="q">2, 4, 8, 16, ?</div></div>
  <div class="slot" id="optsrow">
    <div class="opts">
      <div class="opt" id="o1">24</div>
      <div class="opt" id="o2">32</div>
      <div class="opt" id="o3">30</div>
    </div>
  </div>
  <div class="slot" id="ansrow"><div id="ans">Ответ: 32</div></div>
  <div class="slot" id="tagrow"><div id="tag">Полный тест в боте, ссылка в профиле</div></div>
</div>
<button id="start">Старт</button>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const show = id => document.getElementById(id).classList.add("on");
const el = id => document.getElementById(id);

async function run(){
  el("start").classList.add("gone");
  show("headrow");
  await wait(800);
  show("qrow");
  await wait(3000);
  for (const id of ["o1","o2","o3"]){ el(id).classList.add("on"); await wait(400); }
  await wait(1800);
  el("o2").classList.add("hit");
  el("o1").classList.add("miss");
  el("o3").classList.add("miss");
  await wait(1500);
  show("ansrow");
  await wait(2500);
  show("tagrow");
}
el("start").onclick = run;
</script>
</body>
</html>
