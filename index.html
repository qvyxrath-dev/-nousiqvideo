<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ты решишь это за 5 секунд?</title>
<style>
html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vh 6vw;text-align:center}
.line{opacity:0;transform:translateY(12px);transition:opacity .6s,transform .6s;font-weight:800;line-height:1.25}
.line.on{opacity:1;transform:none}
#q{font-size:9vh;margin-bottom:6vh}
.opts{display:flex;gap:3vw;margin-bottom:6vh}
.opt{width:22vw;height:22vw;max-width:150px;max-height:150px;border-radius:24px;background:#16213a;display:flex;align-items:center;justify-content:center;font-size:7vh;font-weight:800;opacity:0;transform:scale(.9);transition:all .5s}
.opt.on{opacity:1;transform:scale(1)}
.opt.hit{background:#14453b;box-shadow:0 0 0 4px #7fd4a0,0 0 40px rgba(127,212,160,.6)}
#ans{font-size:12vh;color:#7fd4a0;margin-bottom:4vh}
#tag{font-size:4.4vh;color:#9aa6c2;position:absolute;bottom:6vh;left:0;right:0}
#start{position:fixed;inset:0;margin:auto;width:60vw;height:8vh;max-height:70px;border:0;border-radius:999px;background:#14453b;color:#fff;font-size:4vh;font-weight:700;cursor:pointer}
#start.gone{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="q" class="line">Что дальше?</div>
  <div id="seq" class="line" style="font-size:8vh">2, 4, 8, 16, ?</div>
  <div class="opts">
    <div class="opt" id="o1">24</div>
    <div class="opt" id="o2">32</div>
    <div class="opt" id="o3">30</div>
  </div>
  <div id="ans" class="line">Ответ: 32</div>
  <div id="tag" class="line">Полный тест в боте, ссылка в профиле</div>
</div>
<button id="start">Старт</button>
<script>
var wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
function show(id){ document.getElementById(id).classList.add("on"); }
async function run(){
  document.getElementById("start").classList.add("gone");
  show("q");
  await wait(1200);
  show("seq");
  await wait(4000);
  show("o1"); await wait(300);
  show("o2"); await wait(300);
  show("o3");
  await wait(2500);
  document.getElementById("o2").classList.add("hit");
  await wait(1200);
  document.getElementById("q").classList.remove("on");
  document.getElementById("seq").classList.remove("on");
  document.querySelectorAll(".opt").forEach(function(e){ e.classList.remove("on"); });
  await wait(600);
  show("ans");
  await wait(2000);
  show("tag");
}
document.getElementById("start").onclick = run;
</script>
</body>
  </html>
